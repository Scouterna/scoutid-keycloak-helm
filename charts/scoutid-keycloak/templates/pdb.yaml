{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "scoutid-keycloak.fullname" . }}
  labels:
    {{- include "scoutid-keycloak.labels" . | nindent 4 }}
spec:
  {{- /* Compared against "" rather than using `with`, so a numeric 0 still renders:
         maxUnavailable: 0 (block every voluntary eviction) is a real setting, and
         `with` would treat it as empty and silently drop the field. */}}
  {{- $min := .Values.podDisruptionBudget.minAvailable }}
  {{- $max := .Values.podDisruptionBudget.maxUnavailable }}
  {{- $hasMin := and (not (kindIs "invalid" $min)) (ne (toString $min) "") }}
  {{- $hasMax := and (not (kindIs "invalid" $max)) (ne (toString $max) "") }}
  {{- if $hasMin }}
  minAvailable: {{ $min }}
  {{- end }}
  {{- if $hasMax }}
  maxUnavailable: {{ $max }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "scoutid-keycloak.selectorLabels" . | nindent 6 }}
{{- end }}
