{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "scoutid-keycloak.fullname" . }}
  labels:
    {{- include "scoutid-keycloak.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    # Must match the Prometheus serviceMonitorSelector, or it is silently ignored.
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "scoutid-keycloak.selectorLabels" . | nindent 6 }}
  endpoints:
    {{- /* An empty interval/scrapeTimeout is accepted by the API server but makes
           Prometheus fall back to its global defaults, so the scrape silently stops
           honouring these values. Omit the key entirely instead of emitting a blank. */}}
    - port: {{ .Values.metrics.serviceMonitor.port | default "management" }}
      path: {{ .Values.metrics.serviceMonitor.path | default "/metrics" | quote }}
      {{- with .Values.metrics.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
{{- end }}
