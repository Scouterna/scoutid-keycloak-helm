{{- $fullName := include "scoutid-keycloak.fullname" . -}}
{{- $port := .Values.service.httpPort -}}
{{- $isRoute := eq .Values.ingress.type "ingressroute" -}}
{{/* Traefik CRDs are only expected when the cluster actually runs Traefik: either
     ingressroute mode, or a plain Ingress whose class is traefik (where the admin
     allowlist annotation references the Middleware below). Emitting a Middleware
     anywhere else breaks install on clusters without traefik.io CRDs. */}}
{{- $traefik := or $isRoute (and (eq .Values.ingress.type "ingress") (eq .Values.ingress.className "traefik")) -}}

{{- if and $traefik .Values.ingress.admin.enabled .Values.ingress.admin.ipAllowList }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-admin-ipallowlist
  labels:
    {{- include "scoutid-keycloak.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml .Values.ingress.admin.ipAllowList | nindent 6 }}
{{- end }}

{{- if $isRoute }}
{{- if and .Values.ingress.public.enabled .Values.ingress.public.rootRedirect.enabled }}
---
# Traefik answers the redirect before the request reaches Keycloak.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-root-redirect
  labels:
    {{- include "scoutid-keycloak.labels" . | nindent 4 }}
spec:
  redirectRegex:
    regex: {{ printf "^https://%s/?$" (.Values.hostname.public | replace "." "\\.") | quote }}
    replacement: {{ .Values.ingress.public.rootRedirect.url | quote }}
    permanent: true
{{- end }}
{{- if .Values.ingress.public.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "scoutid-keycloak.publicTlsSecret" . }}
  labels:
    {{- include "scoutid-keycloak.labels" . | nindent 4 }}
spec:
  secretName: {{ include "scoutid-keycloak.publicTlsSecret" . }}
  issuerRef:
    name: {{ .Values.ingress.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.hostname.public | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullName }}-public
  labels:
    {{- include "scoutid-keycloak.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint }}
  routes:
    {{- if .Values.ingress.public.rootRedirect.enabled }}
    # Explicit priority: Traefik derives priority from rule length, and
    # PathPrefix(`/`) is longer than Path(`/`), so a catch-all path would otherwise
    # win over this redirect and it would silently never fire.
    - kind: Rule
      match: Host(`{{ .Values.hostname.public }}`) && Path(`/`)
      priority: 1000
      middlewares:
        - name: {{ $fullName }}-root-redirect
      services:
        - name: {{ $fullName }}
          port: {{ $port }}
    {{- end }}
    {{- $paths := .Values.ingress.public.paths | default (list "/") }}
    {{- range $paths }}
    - kind: Rule
      match: Host(`{{ $.Values.hostname.public }}`) && PathPrefix(`{{ . }}`)
      {{- if and (eq . "/") $.Values.ingress.public.rootRedirect.enabled }}
      priority: 1
      {{- end }}
      services:
        - name: {{ $fullName }}
          port: {{ $port }}
    {{- end }}
  tls:
    secretName: {{ include "scoutid-keycloak.publicTlsSecret" . }}
{{- end }}
{{- if .Values.ingress.admin.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "scoutid-keycloak.adminTlsSecret" . }}
  labels:
    {{- include "scoutid-keycloak.labels" . | nindent 4 }}
spec:
  secretName: {{ include "scoutid-keycloak.adminTlsSecret" . }}
  issuerRef:
    name: {{ .Values.ingress.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.hostname.admin | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullName }}-admin
  labels:
    {{- include "scoutid-keycloak.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.hostname.admin }}`)
      {{- with .Values.ingress.admin.ipAllowList }}
      middlewares:
        - name: {{ $fullName }}-admin-ipallowlist
      {{- end }}
      services:
        - name: {{ $fullName }}
          port: {{ $port }}
  tls:
    secretName: {{ include "scoutid-keycloak.adminTlsSecret" . }}
{{- end }}
{{- end }}
