{{- if or .Values.scoutid.enabled .Values.configCli.enabled }}
{{- $cmName := default (printf "%s-realm-config" (include "scoutid-keycloak.fullname" .)) .Values.configCli.existingConfigMap }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "scoutid-keycloak.fullname" . }}-config
  labels:
    {{- include "scoutid-keycloak.labels" . | nindent 4 }}
  {{- if .Values.configCli.hook }}
  annotations:
    argocd.argoproj.io/hook: {{ .Values.configCli.hook }}
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  {{- end }}
spec:
  backoffLimit: {{ .Values.configCli.backoffLimit }}
  {{- with .Values.configCli.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "scoutid-keycloak.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: config-cli
      {{- if not .Values.configCli.existingConfigMap }}
      annotations:
        # Re-runs the Job when the realm config changes. With an existingConfigMap
        # the chart cannot see the content, so there is nothing to checksum — and
        # the key is dropped entirely rather than left as an empty map.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-realm.yaml") . | sha256sum }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      # Talks only to Keycloak's HTTP API, never to the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.configCli.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: keycloak-config-cli
          image: {{ .Values.configCli.image }}
          {{- with .Values.configCli.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: KEYCLOAK_URL
              value: {{ include "scoutid-keycloak.internalUrl" . | quote }}
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.bootstrap.existingSecret }}
                  key: {{ .Values.admin.bootstrap.usernameKey }}
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.bootstrap.existingSecret }}
                  key: {{ .Values.admin.bootstrap.passwordKey }}
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: {{ .Values.configCli.availabilityCheckTimeout | quote }}
            - name: IMPORT_FILES_LOCATIONS
              value: /config/*
            # Off by default in the tool: without it, $(env:X) is stored as a literal.
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: {{ .Values.configCli.varSubstitution | quote }}
            # Both default to "full" in the tool, which deletes anything the config
            # files do not declare. Clients are operator-owned and groups are
            # provider-synced, so neither may be pruned. Set explicitly rather than
            # relying on the partial-document layout to spare them.
            - name: IMPORT_MANAGED_CLIENT
              value: {{ .Values.configCli.managedClient | quote }}
            - name: IMPORT_MANAGED_GROUP
              value: {{ .Values.configCli.managedGroup | quote }}
            {{- with .Values.configCli.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.configCli.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            {{- toYaml .Values.configCli.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ $cmName }}
{{- end }}
