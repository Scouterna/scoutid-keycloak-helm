# ScoutID Keycloak. Defaults target the Scouterna azure-webservices cluster
# (Traefik, cert-manager, CloudNativePG, kube-prometheus-stack) but every
# platform choice is a value. See docs/configuration.md.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/scouterna/scoutid-keycloak
  # Upstream publishes only `latest` and `sha-<short>` — there is no semver tag,
  # so this cannot default to appVersion. Pin a sha- tag for production.
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1                  # >1 requires cache.enabled

hostname:
  public: ""                     # bare host, e.g. id.scouterna.se
  admin: ""                      # optional split admin host
  strict: true

# mode: cnpg | external
database:
  mode: cnpg
  cnpg:
    clusterName: ""              # reads "<clusterName>-app" and "<clusterName>-rw"
    secretName: ""               # override the generated app secret
    host: ""                     # override the -rw service
    database: app                # CloudNativePG's default bootstrap database
    sslMode: disable             # in-cluster hop; CNPG requires client certs for verify-*
  external:
    jdbcUrl: ""                  # wins over host/port/name if set
    host: ""
    port: 5432
    name: keycloak
    sslMode: require
    params: ""                   # extra JDBC query params
  credentials:
    existingSecret: ""           # defaults to the cnpg app secret
    usernameKey: username
    passwordKey: password

admin:
  bootstrap:
    existingSecret: ""           # omit to skip bootstrap admin (already-provisioned DB)
    usernameKey: KC_BOOTSTRAP_ADMIN_USERNAME
    passwordKey: KC_BOOTSTRAP_ADMIN_PASSWORD
  ensurePermanentAdmin:
    enabled: false
    existingSecret: ""
    usernameKey: MASTER_ADMIN_USERNAME
    passwordKey: MASTER_ADMIN_PASSWORD
    hook: PostSync               # ArgoCD hook; "" renders a plain Job
    backoffLimit: 3
    ttlSecondsAfterFinished: 600

scoutnet:
  baseUrl: https://scoutnet.se

keycloak:
  proxyHeaders: xforwarded
  httpEnabled: true
  logLevel: ""                   # e.g. INFO,se.scouterna.keycloak:DEBUG
  features:
    userEventMetrics: true       # baked in at build time; false only for a stripped image
    userEventMetricsTags: realm,idp,clientId
  extraEnv: []
  extraEnvFrom: []

service:
  type: ClusterIP
  httpPort: 8080
  managementPort: 9000           # /health/* and /metrics
  annotations: {}

ingress:
  type: ingress                  # ingress | ingressroute | none
  className: traefik
  clusterIssuer: letsencrypt-prod
  entryPoint: websecure          # ingressroute only
  annotations: {}
  public:
    enabled: true
    paths:                       # [] or ["/"] exposes everything
      - /realms
      - /resources
    rootRedirect:
      enabled: false             # ingressroute only
      url: https://www.scouterna.se/scout-ledare-kar/leda-kar/etjanster/scoutid/
    tlsSecretName: ""
  admin:
    enabled: false
    ipAllowList: []              # empty = no gate
    tlsSecretName: ""

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: kps               # kube-prometheus-stack selector; wrong label = silently no metrics
    interval: 30s
    scrapeTimeout: 10s

# keycloak-config-cli. Off by default: group renames are destructive even with
# IMPORT_MANAGED_GROUP=no-delete. See docs/configuration.md.
configCli:
  enabled: false
  image: docker.io/adorsys/keycloak-config-cli:6.5.1-26
  varSubstitution: true          # off in the tool itself; without it $(env:X) is stored literally
  configDir: ""                  # path globbed into a ConfigMap
  existingConfigMap: ""
  managedGroup: no-delete
  availabilityCheckTimeout: 300s
  extraEnv: []
  extraEnvFrom: []               # client-secret Secrets referenced as $(env:...)
  hook: ""                       # "" | Sync | PostSync
  backoffLimit: 10
  ttlSecondsAfterFinished: 600

cache:
  enabled: false                 # KC_CACHE=ispn + KUBE_PING; required for replicaCount > 1
  stack: kubernetes

initContainers:
  # Off by default: Keycloak retries the DB itself and startupProbe covers slow
  # first boots. This only makes the wait visible in logs.
  waitForDb:
    enabled: false
    image: docker.io/library/busybox:1.36
    runAsUser: 65534               # busybox is UID 0; runAsNonRoot would reject it

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # Keycloak writes to /opt/keycloak/data at runtime
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 1280Mi               # no CPU limit: house style

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""             # set one or the other, not both

startupProbe:
  enabled: true
  periodSeconds: 10
  failureThreshold: 60           # Liquibase migrations on first boot are slow

readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 30

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 15
  failureThreshold: 3

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

extraVolumes: []                 # e.g. CSI SecretProviderClass mounts
extraVolumeMounts: []
